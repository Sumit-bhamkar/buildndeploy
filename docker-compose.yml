
services:
  mysql:
    image: mysql:8.4
    container_name: buildndeploy-mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - buildndeploy_mysql_data:/var/lib/mysql
    networks:
      - buildndeploy-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    image: buildndeploy-backend:1.0
    container_name: buildndeploy-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - buildndeploy-network

  frontend:
    build:
      context: ./frontend
    image: buildndeploy-frontend:1.1
    container_name: buildndeploy-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - buildndeploy-network

networks:
  buildndeploy-network:
    driver: bridge

volumes:
  buildndeploy_mysql_data:
    external: true
    name: buildndeploy_mysql_data
